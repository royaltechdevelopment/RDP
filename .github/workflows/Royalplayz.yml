name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $password = ConvertTo-SecureString "RoyalPlayz#2026Secure!" -AsPlainText -Force

          $user = Get-LocalUser -Name "royalplayz" -ErrorAction SilentlyContinue

          if ($user) {
              Set-LocalUser -Name "royalplayz" -Password $password
          }
          else {
              New-LocalUser `
                -Name "royalplayz" `
                -Password $password `
                -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "royalplayz" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "royalplayz" `
            -ErrorAction SilentlyContinue

          Write-Host "User royalplayz is ready."

      - name: Install Tailscale
        shell: powershell
        run: |
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installerPath

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force

      - name: Connect Tailscale
        shell: powershell
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
            --hostname=royalplayz

          Start-Sleep -Seconds 10

          $tsIP = & $tailscale ip -4

          if (-not $tsIP) {
            Write-Error "Tailscale IP was not assigned."
            exit 1
          }

          Write-Host "=========================="
          Write-Host "RDP IS READY"
          Write-Host "Hostname: royalplayz"
          Write-Host "Tailscale IP: $tsIP"
          Write-Host "Username: royalplayz"
          Write-Host "=========================="

      - name: Keep RDP Active
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }              Start-Sleep -Seconds 300
          }
